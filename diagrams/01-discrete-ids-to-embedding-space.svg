<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ids-to-embedding-title ids-to-embedding-desc" id="d-01-discrete-ids-to-embedding-space-root">
        <title id="ids-to-embedding-title">Discrete token IDs to L2-normalized embedding space pipeline</title>
        <desc id="ids-to-embedding-desc">Dataflow across Tokenizer Input, XLA Gather Lookup, Sequence Pooling, and Hypersphere Geometry showing how discrete integer token IDs index W_embed[token_ids], apply padding mask pooling, and project onto the unit sphere.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-01-discrete-ids-to-embedding-space-root { --paper: #F7F6F2; --paper-2: #EFECE6; --ink: #0F2547; --muted: #3B5B8C;
      --soft: #5A76A3; --rule: rgba(15,37,71,0.14); --accent: #C59216;
      --accent-text: #9A6F0B; --accent-tint: rgba(197,146,22,0.12); --link: #1D4ED8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #d-01-discrete-ids-to-embedding-space-root { color: var(--ink); font-family: var(--sans); }
      #d-01-discrete-ids-to-embedding-space-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-01-discrete-ids-to-embedding-space-root .step-number, #d-01-discrete-ids-to-embedding-space-root .step-label, #d-01-discrete-ids-to-embedding-space-root .lane-label, #d-01-discrete-ids-to-embedding-space-root .role-text, #d-01-discrete-ids-to-embedding-space-root .chip-text, #d-01-discrete-ids-to-embedding-space-root .legend-label { font-family: var(--mono); text-anchor: middle; }
      #d-01-discrete-ids-to-embedding-space-root .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; dominant-baseline: central; }
      #d-01-discrete-ids-to-embedding-space-root .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
      #d-01-discrete-ids-to-embedding-space-root .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
      #d-01-discrete-ids-to-embedding-space-root .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; dominant-baseline: central; }
      #d-01-discrete-ids-to-embedding-space-root .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
      #d-01-discrete-ids-to-embedding-space-root .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
      #d-01-discrete-ids-to-embedding-space-root .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
      #d-01-discrete-ids-to-embedding-space-root .chip-text { fill: #fff; font-size: 5px; font-weight: 700; dominant-baseline: central; }
      #d-01-discrete-ids-to-embedding-space-root .focal-text { fill: var(--accent-text); }
      #d-01-discrete-ids-to-embedding-space-root .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
      #d-01-discrete-ids-to-embedding-space-root .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
      #d-01-discrete-ids-to-embedding-space-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-01-discrete-ids-to-embedding-space-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="#0f2547" fill-opacity="0.10"/></pattern>
          <marker id="d-01-discrete-ids-to-embedding-space-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3B5B8C"/></marker>
          <marker id="d-01-discrete-ids-to-embedding-space-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#C59216"/></marker>
          <marker id="d-01-discrete-ids-to-embedding-space-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#1D4ED8"/></marker>
        </defs>
        <rect width="728" height="436" fill="#F7F6F2"/>
        <rect width="728" height="436" fill="url(#d-01-discrete-ids-to-embedding-space-dots)"/>
        <rect x="0" y="36" width="728" height="80" fill="#0f2547" fill-opacity="0.02"/>
        <rect x="0" y="196" width="728" height="80" fill="#0f2547" fill-opacity="0.02"/>

        <!-- Header and lane hairlines -->
        <line x1="0" y1="36" x2="728" y2="36" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="116" x2="728" y2="116" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="196" x2="728" y2="196" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="276" x2="728" y2="276" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="356" x2="728" y2="356" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="140" y1="36" x2="140" y2="356" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>

        <g aria-label="Pipeline steps">
          <rect x="180" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">TOKENS</text>
          <rect x="292" y="6" width="32" height="16" rx="8" fill="#c59216" fill-opacity="0.20"/><text x="308" y="14" class="step-number focal-text">02</text><text x="308" y="29" class="step-label focal-text">GATHER</text>
          <rect x="404" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="420" y="14" class="step-number">03</text><text x="420" y="29" class="step-label">MASK</text>
          <rect x="516" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">POOL</text>
          <rect x="628" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">L2 NORM</text>
        </g>

        <g aria-label="Role lanes">
          <text x="70" y="72" class="lane-label">TOKENIZER</text><text x="70" y="84" class="lane-label">INPUT IDS</text>
          <text x="70" y="152" class="lane-label">EMBEDDING</text><text x="70" y="164" class="lane-label">TABLE</text>
          <text x="70" y="232" class="lane-label">MASKED</text><text x="70" y="244" class="lane-label">POOLING</text>
          <text x="70" y="312" class="lane-label">HYPERSPHERE</text><text x="70" y="324" class="lane-label">GEOMETRY</text>
        </g>

        <!-- Connectors before nodes (orthogonal r=8 elbows) -->
        <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#C59216" stroke-width="1.3" marker-end="url(#d-01-discrete-ids-to-embedding-space-arr-accent)"/>
        <path d="M358 156 H412 Q420 156 420 164 V204" fill="none" stroke="#3B5B8C" marker-end="url(#d-01-discrete-ids-to-embedding-space-arr-muted)"/>
        <path d="M470 236 H482" fill="none" stroke="#3B5B8C" marker-end="url(#d-01-discrete-ids-to-embedding-space-arr-muted)"/>
        <path d="M582 236 H636 Q644 236 644 244 V284" fill="none" stroke="#1D4ED8" marker-end="url(#d-01-discrete-ids-to-embedding-space-arr-link)"/>

        <rect x="252" y="58" width="52" height="12" rx="2" fill="#F7F6F2"/>
        <text x="278" y="67" fill="#9A6F0B" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO 1-HOT</text>

        <!-- Node 1: Discrete Token IDs -->
        <rect x="146" y="44" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="150" y="48" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="159" y="53" class="role-text">ID</text>
        <text x="196" y="67" class="node-title">Token IDs + Pad</text><text x="196" y="79" class="node-sub">int32[32, 64]</text><text x="196" y="91" class="node-tool">PAD_ID = 0</text>
        <rect x="150" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="158" y="104" class="chip-text">ID</text>
        <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="104" class="chip-text">ID</text>

        <!-- Node 2: W_embed[token_ids] Gather (FOCAL) -->
        <rect x="258" y="124" width="100" height="64" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.4"/>
        <rect x="262" y="128" width="18" height="10" rx="3" fill="#c59216" fill-opacity="0.22"/><text x="271" y="133" class="role-text focal-text">LUT</text>
        <text x="308" y="147" class="node-title">W_embed[ids]</text><text x="308" y="159" class="node-sub">f32[32000, 128]</text><text x="308" y="171" class="node-tool">no 250 MiB one-hot</text>
        <rect x="262" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="270" y="184" class="chip-text">ID</text>
        <rect x="338" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="346" y="184" class="chip-text">3D</text>

        <!-- Node 3: Masking PAD tokens -->
        <rect x="370" y="204" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="374" y="208" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="383" y="213" class="role-text">MSK</text>
        <text x="420" y="227" class="node-title">Padding Mask</text><text x="420" y="239" class="node-sub">ids != PAD_ID</text><text x="420" y="251" class="node-tool">zero pad grad</text>
        <rect x="374" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="382" y="264" class="chip-text">3D</text>
        <rect x="450" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="264" class="chip-text">3D</text>

        <!-- Node 4: Mean Pooling -->
        <rect x="482" y="204" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="486" y="208" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="495" y="213" class="role-text">AVG</text>
        <text x="532" y="227" class="node-title">Mean Pooling</text><text x="532" y="239" class="node-sub">sum(v*m)/len</text><text x="532" y="251" class="node-tool">f32[32, 128]</text>
        <rect x="486" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="494" y="264" class="chip-text">3D</text>
        <rect x="562" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="570" y="264" class="chip-text">2D</text>

        <!-- Node 5: L2 Normalization on Unit Hypersphere -->
        <rect x="594" y="284" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="598" y="288" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="607" y="293" class="role-text">L2</text>
        <text x="644" y="307" class="node-title">Unit Hypersphere</text><text x="644" y="319" class="node-sub">v / ||v||_2</text><text x="644" y="331" class="node-tool">||e|| = 1.0</text>
        <rect x="598" y="338" width="16" height="8" rx="3" fill="#9c6b50"/><text x="606" y="344" class="chip-text">2D</text>
        <rect x="674" y="338" width="16" height="8" rx="3" fill="#9c6b50"/><text x="682" y="344" class="chip-text">S1</text>

        <!-- Legend: steps -->
        <text x="164" y="373" class="legend-label">STEPS</text>
        <rect x="180" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="192" y="372" class="step-number">01</text><text x="212" y="373" class="legend-text">Tokens</text>
        <rect x="272" y="364" width="24" height="12" rx="6" fill="#c59216" fill-opacity="0.20"/><text x="284" y="372" class="step-number focal-text">02</text><text x="304" y="373" class="legend-text">Gather</text>
        <rect x="360" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="372" y="372" class="step-number">03</text><text x="392" y="373" class="legend-text">Mask</text>
        <rect x="456" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="468" y="372" class="step-number">04</text><text x="488" y="373" class="legend-text">Pool</text>
        <rect x="556" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="568" y="372" class="step-number">05</text><text x="588" y="373" class="legend-text">L2 Norm</text>

        <!-- Legend: data types -->
        <text x="164" y="394" class="legend-label">DATA TYPE</text>
        <rect x="180" y="386" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="188" y="392" class="chip-text">ID</text><text x="202" y="394" class="legend-text">Discrete int32</text>
        <rect x="288" y="386" width="16" height="8" rx="3" fill="#b8915a"/><text x="296" y="392" class="chip-text">3D</text><text x="310" y="394" class="legend-text">Token embeddings</text>
        <rect x="404" y="386" width="16" height="8" rx="3" fill="#9c6b50"/><text x="412" y="392" class="chip-text">S1</text><text x="426" y="394" class="legend-text">Unit sphere vector</text>
        <text x="520" y="394" class="legend-text">left chip = input · right chip = output</text>

        <!-- Legend: flow -->
        <text x="164" y="416" class="legend-label">FLOW</text>
        <line x1="180" y1="413" x2="204" y2="413" stroke="#C59216" stroke-width="1.3" marker-end="url(#d-01-discrete-ids-to-embedding-space-arr-accent)"/><text x="212" y="416" class="legend-text">XLA Gather lookup</text>
        <line x1="308" y1="413" x2="332" y2="413" stroke="#3B5B8C" marker-end="url(#d-01-discrete-ids-to-embedding-space-arr-muted)"/><text x="340" y="416" class="legend-text">Masked sequence op</text>
        <line x1="460" y1="413" x2="484" y2="413" stroke="#1D4ED8" marker-end="url(#d-01-discrete-ids-to-embedding-space-arr-link)"/><text x="492" y="416" class="legend-text">Unit norm projection</text>
      </svg>
