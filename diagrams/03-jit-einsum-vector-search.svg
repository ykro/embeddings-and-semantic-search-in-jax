<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jit-vector-search-title jit-vector-search-desc" id="d-03-jit-einsum-vector-search-root">
        <title id="jit-vector-search-title">Fused @jax.jit vector search engine pipeline</title>
        <desc id="jit-vector-search-desc">Dataflow across Query Batch, Pre-Normalized Index, Batched Einsum Contraction, and OpenXLA Top-K Selection showing how 128 queries search 50,000 vectors of dimension 256 in a single compiled XLA kernel.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-03-jit-einsum-vector-search-root { --paper: #F7F6F2; --paper-2: #EFECE6; --ink: #0F2547; --muted: #3B5B8C;
      --soft: #5A76A3; --rule: rgba(15,37,71,0.14); --accent: #C59216;
      --accent-text: #9A6F0B; --accent-tint: rgba(197,146,22,0.12); --link: #1D4ED8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #d-03-jit-einsum-vector-search-root { color: var(--ink); font-family: var(--sans); }
      #d-03-jit-einsum-vector-search-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-jit-einsum-vector-search-root .step-number, #d-03-jit-einsum-vector-search-root .step-label, #d-03-jit-einsum-vector-search-root .lane-label, #d-03-jit-einsum-vector-search-root .role-text, #d-03-jit-einsum-vector-search-root .chip-text, #d-03-jit-einsum-vector-search-root .legend-label { font-family: var(--mono); text-anchor: middle; }
      #d-03-jit-einsum-vector-search-root .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; dominant-baseline: central; }
      #d-03-jit-einsum-vector-search-root .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
      #d-03-jit-einsum-vector-search-root .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
      #d-03-jit-einsum-vector-search-root .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; dominant-baseline: central; }
      #d-03-jit-einsum-vector-search-root .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
      #d-03-jit-einsum-vector-search-root .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
      #d-03-jit-einsum-vector-search-root .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
      #d-03-jit-einsum-vector-search-root .chip-text { fill: #fff; font-size: 5px; font-weight: 700; dominant-baseline: central; }
      #d-03-jit-einsum-vector-search-root .focal-text { fill: var(--accent-text); }
      #d-03-jit-einsum-vector-search-root .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
      #d-03-jit-einsum-vector-search-root .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
      #d-03-jit-einsum-vector-search-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-03-jit-einsum-vector-search-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="#0f2547" fill-opacity="0.10"/></pattern>
          <marker id="d-03-jit-einsum-vector-search-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3B5B8C"/></marker>
          <marker id="d-03-jit-einsum-vector-search-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#C59216"/></marker>
          <marker id="d-03-jit-einsum-vector-search-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#1D4ED8"/></marker>
        </defs>
        <rect width="728" height="436" fill="#F7F6F2"/>
        <rect width="728" height="436" fill="url(#d-03-jit-einsum-vector-search-dots)"/>
        <rect x="0" y="36" width="728" height="80" fill="#0f2547" fill-opacity="0.02"/>
        <rect x="0" y="196" width="728" height="80" fill="#0f2547" fill-opacity="0.02"/>

        <!-- Header and lane hairlines -->
        <line x1="0" y1="36" x2="728" y2="36" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="116" x2="728" y2="116" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="196" x2="728" y2="196" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="276" x2="728" y2="276" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="356" x2="728" y2="356" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="140" y1="36" x2="140" y2="356" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>

        <g aria-label="Pipeline steps">
          <rect x="180" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">QUERIES</text>
          <rect x="292" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">INDEX</text>
          <rect x="404" y="6" width="32" height="16" rx="8" fill="#c59216" fill-opacity="0.20"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">EINSUM</text>
          <rect x="516" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">TOP_K</text>
          <rect x="628" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">RESULTS</text>
        </g>

        <g aria-label="Role lanes">
          <text x="70" y="72" class="lane-label">QUERY</text><text x="70" y="84" class="lane-label">BATCH</text>
          <text x="70" y="152" class="lane-label">DOCUMENT</text><text x="70" y="164" class="lane-label">INDEX</text>
          <text x="70" y="232" class="lane-label">XLA FUSED</text><text x="70" y="244" class="lane-label">KERNEL</text>
          <text x="70" y="312" class="lane-label">RANKED</text><text x="70" y="324" class="lane-label">OUTPUT</text>
        </g>

        <!-- Connectors before nodes (orthogonal r=8 elbows) -->
        <path d="M246 76 H412 Q420 76 420 84 V204" fill="none" stroke="#C59216" stroke-width="1.3" marker-end="url(#d-03-jit-einsum-vector-search-arr-accent)"/>
        <path d="M358 156 H396 Q404 156 404 164 V204" fill="none" stroke="#3B5B8C" marker-end="url(#d-03-jit-einsum-vector-search-arr-muted)"/>
        <path d="M470 236 H482" fill="none" stroke="#C59216" stroke-width="1.3" marker-end="url(#d-03-jit-einsum-vector-search-arr-accent)"/>
        <path d="M582 236 H636 Q644 236 644 244 V284" fill="none" stroke="#1D4ED8" marker-end="url(#d-03-jit-einsum-vector-search-arr-link)"/>

        <rect x="316" y="58" width="64" height="12" rx="2" fill="#F7F6F2"/>
        <text x="348" y="67" fill="#9A6F0B" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">F32[128,256]</text>

        <!-- Node 1: Query Batch L2 Normalize -->
        <rect x="146" y="44" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="150" y="48" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="159" y="53" class="role-text">QRY</text>
        <text x="196" y="67" class="node-title">Query Batch</text><text x="196" y="79" class="node-sub">q / ||q||_2</text><text x="196" y="91" class="node-tool">128 queries</text>
        <rect x="150" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="158" y="104" class="chip-text">QD</text>
        <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="104" class="chip-text">QD</text>

        <!-- Node 2: Pre-Normalized Vector Index -->
        <rect x="258" y="124" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="262" y="128" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="271" y="133" class="role-text">IDX</text>
        <text x="308" y="147" class="node-title">Vector Index</text><text x="308" y="159" class="node-sub">f32[50000, 256]</text><text x="308" y="171" class="node-tool">48.8 MiB RAM</text>
        <rect x="262" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="270" y="184" class="chip-text">ND</text>
        <rect x="338" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="346" y="184" class="chip-text">ND</text>

        <!-- Node 3: jnp.einsum("qd,nd->qn") (FOCAL) -->
        <rect x="370" y="204" width="100" height="64" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.4"/>
        <rect x="374" y="208" width="18" height="10" rx="3" fill="#c59216" fill-opacity="0.22"/><text x="383" y="213" class="role-text focal-text">EIN</text>
        <text x="420" y="227" class="node-title">jnp.einsum</text><text x="420" y="239" class="node-sub">"qd,nd-&gt;qn"</text><text x="420" y="251" class="node-tool">6.4M cosines</text>
        <rect x="374" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="264" class="chip-text">QD</text>
        <rect x="450" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="264" class="chip-text">QN</text>

        <!-- Node 4: jax.lax.top_k -->
        <rect x="482" y="204" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="486" y="208" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="495" y="213" class="role-text">XLA</text>
        <text x="532" y="227" class="node-title">jax.lax.top_k</text><text x="532" y="239" class="node-sub">scores, k=5</text><text x="532" y="251" class="node-tool">fused selection</text>
        <rect x="486" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="494" y="264" class="chip-text">QN</text>
        <rect x="562" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="570" y="264" class="chip-text">TK</text>

        <!-- Node 5: Top-K Scores & IDs -->
        <rect x="594" y="284" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="598" y="288" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="607" y="293" class="role-text">OUT</text>
        <text x="644" y="307" class="node-title">Top-5 Matches</text><text x="644" y="319" class="node-sub">scores + doc_ids</text><text x="644" y="331" class="node-tool">[128, 5] exact</text>
        <rect x="598" y="338" width="16" height="8" rx="3" fill="#9c6b50"/><text x="606" y="344" class="chip-text">TK</text>
        <rect x="674" y="338" width="16" height="8" rx="3" fill="#9c6b50"/><text x="682" y="344" class="chip-text">ID</text>

        <!-- Legend: steps -->
        <text x="164" y="373" class="legend-label">STEPS</text>
        <rect x="180" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="192" y="372" class="step-number">01</text><text x="212" y="373" class="legend-text">Queries</text>
        <rect x="272" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="284" y="372" class="step-number">02</text><text x="304" y="373" class="legend-text">Index</text>
        <rect x="360" y="364" width="24" height="12" rx="6" fill="#c59216" fill-opacity="0.20"/><text x="372" y="372" class="step-number focal-text">03</text><text x="392" y="373" class="legend-text">einsum</text>
        <rect x="456" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="468" y="372" class="step-number">04</text><text x="488" y="373" class="legend-text">top_k</text>
        <rect x="556" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="568" y="372" class="step-number">05</text><text x="588" y="373" class="legend-text">Output</text>

        <!-- Legend: data types -->
        <text x="164" y="394" class="legend-label">DATA TYPE</text>
        <rect x="180" y="386" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="188" y="392" class="chip-text">QD</text><text x="202" y="394" class="legend-text">Unit embeddings</text>
        <rect x="288" y="386" width="16" height="8" rx="3" fill="#b8915a"/><text x="296" y="392" class="chip-text">QN</text><text x="310" y="394" class="legend-text">Cosine matrix [128,50k]</text>
        <rect x="424" y="386" width="16" height="8" rx="3" fill="#9c6b50"/><text x="432" y="392" class="chip-text">TK</text><text x="446" y="394" class="legend-text">Top-K tensors [128,5]</text>
        <text x="548" y="394" class="legend-text">left = in · right = out</text>

        <!-- Legend: flow -->
        <text x="164" y="416" class="legend-label">FLOW</text>
        <line x1="180" y1="413" x2="204" y2="413" stroke="#C59216" stroke-width="1.3" marker-end="url(#d-03-jit-einsum-vector-search-arr-accent)"/><text x="212" y="416" class="legend-text">Fused XLA matmul</text>
        <line x1="308" y1="413" x2="332" y2="413" stroke="#3B5B8C" marker-end="url(#d-03-jit-einsum-vector-search-arr-muted)"/><text x="340" y="416" class="legend-text">Pre-normalized buffer</text>
        <line x1="460" y1="413" x2="484" y2="413" stroke="#1D4ED8" marker-end="url(#d-03-jit-einsum-vector-search-arr-link)"/><text x="492" y="416" class="legend-text">PJRT device return</text>
      </svg>
